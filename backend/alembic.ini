# Alembic CLI config. Run from backend/:
#   alembic upgrade head                     # apply pending revisions
#   alembic revision -m "add foo to bar"     # new raw-SQL revision in app/migrations/versions
#   alembic current / alembic history
# The database URL comes from DATABASE_URL (app.config.settings); the app also
# upgrades to head on startup, so the CLI is mostly for authoring and inspecting.

[alembic]
script_location = %(here)s/app/migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
